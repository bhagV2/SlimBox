<VirtualHost *:80>
    ServerName slimbox.local
    DocumentRoot /var/www/html/3eme-annee/Atelier-Web/SlimBox/public

    <Directory /var/www/html/3eme-annee/Atelier-Web/SlimBox/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/slimbox-error.log
    CustomLog ${APACHE_LOG_DIR}/slimbox-access.log combined
</VirtualHost>